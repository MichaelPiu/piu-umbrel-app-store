version: "3.7"

services:
  app_proxy:
    environment:
      # Formato: <app-id>_<servizio>_1
      APP_HOST: piu-live-catch_web_1
      APP_PORT: 8080
      # L'overlay /overlay deve essere raggiungibile da OBS senza il login di Umbrel.
      # L'app ha una propria autenticazione per /admin e per tutte le API amministrative.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/michaelpiu/pokemon-twitch-catch:1.0.1@sha256:f5b60091c595bd22af7ad2d6883aa4a20e5751c4f18f19aac3075b61f7640dea
    restart: on-failure
    init: true
    user: "1000:1000"
    stop_grace_period: 15s
    environment:
      DATA_DIR: /data
      # Password del primo accesso (mostrata da Umbrel nelle credenziali dell'app).
      ADMIN_INITIAL_PASSWORD: ${APP_PASSWORD}
      TZ: Europe/Rome
      # Proxy autorizzati a inoltrare l'IP reale del browser (X-Forwarded-For):
      # - docker-gateway: umbrelOS 2.x, il gateway delle app gira sull'host e si
      #   collega al container dal gateway della rete Docker;
      # - piu-live-catch_app_proxy_1: umbrelOS 1.x, sidecar app_proxy.
      # Ogni altro mittente viene ignorato (nessun bypass del limite di login).
      TRUSTED_PROXIES: "docker-gateway,piu-live-catch_app_proxy_1"
      # Cartella dei backup di rete: montata da umbrelOS (folderAccess in umbrel-app.yml).
      BACKUP_TARGET_ROOT: /backups-network
    volumes:
      - ${APP_DATA_DIR}/data:/data
